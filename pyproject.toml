[build-system]
# setuptools >= 77 for PEP 639 SPDX license expressions.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eccopy"
dynamic = ["version"]
description = "Data-agnostic Python implementation of the ECCO / ConvStratFinder radar echo classification algorithm (1-D, 2-D-V, 2-D-H, 3-D). Operates purely on numpy arrays, with no file I/O."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Ian Christian Cornejo", email = "ian.cornejo@colostate.edu" },
]
keywords = ["radar", "meteorology", "precipitation", "convection", "echo-classification"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.58",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "matplotlib>=3.7",
    # test_packaging.py builds a real wheel; without this it importorskips.
    "build>=1.0",
]

[project.urls]
Repository = "https://github.com/iancornejo/EccoPy"
"Algorithm Reference" = "https://doi.org/10.1175/JTECH-D-22-0019.1"

[tool.setuptools.dynamic]
version = { attr = "eccopy.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["eccopy*"]

[tool.setuptools.package-data]
eccopy = ["core/data/disk_strels/*.mat", "core/data/disk_decomp/*.mat"]

[tool.pytest.ini_options]
testpaths = ["eccopy/tests"]
addopts = "-v"
markers = [
    "slow: builds a real wheel or runs an example end-to-end; slower than the rest of the suite",
]

[tool.coverage.run]
source = ["eccopy"]
omit = ["eccopy/tests/*"]
